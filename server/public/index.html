<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Primes Server</title>
</head>
<body>
    <h1>Distributed Primes Server</h1>
    
    <h2>Clients</h2>
    <table id="clients">
        <thead>
            <tr><th>ID</th><th>IP</th><th>Port</th><th>Last Seen</th><th>Status</th><th>Algorithm</th><th>Blocks Done</th><th>Primes Found</th><th>Avg Block Time</th><th>Current Block</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Overview</h2>
    <table id="overview"><tbody></tbody></table>

    <div id="algorithms"></div>

    <script>
        const clientsBody = document.querySelector("#clients tbody");
        const algsContainer = document.querySelector("#algorithms");

        function primeRows(list) {
            return list.map((p, i) => {
                const tr = document.createElement("tr");
                for (const text of [
                    i + 1,
                    p.digits.toLocaleString(),
                    p.dims.join("×"),
                    p.fills[0],
                    p.fills[1],
                    p.client,
                    timeAgo(p.found_at * 1000),
                ]) {
                    const td = document.createElement("td");
                    td.textContent = text;
                    tr.append(td);
                }
                return tr;
            });
        }

        function showMessage(text) {
            clientsBody.replaceChildren();
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 11;
            td.textContent = text;
            tr.append(td);
            clientsBody.append(tr);
        }

        function timeAgo(date) {
            const ms = Date.now() - new Date(date).getTime();
            
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return "Just now";
            if (minutes < 60) return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            if (hours < 24)   return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            return `${days} day${days > 1 ? 's' : ''} ago`;
        }


        let algorithmsCache = null;

        async function getAlgorithms() {
            if (algorithmsCache) return algorithmsCache;
            try {
                const res = await fetch("/api/algorithms");
                if (!res.ok) throw new Error(res.status);
                algorithmsCache = await res.json();
            } catch (e) {
                console.error("Could not load algorithms:", e);
                return [];
            }
            return algorithmsCache;
        }

        async function post(url) {
            try {
                await fetch(url, { method: "POST" });
            } catch (e) {
                console.error("Request failed:", e);
            }
            fetchClientInfo();
        }

        const overviewBody = document.querySelector("#overview tbody");
        const topBody = document.querySelector("#top tbody");

        function textRow(cells) {
            const tr = document.createElement("tr");
            for (const text of cells) {
                const td = document.createElement("td");
                td.textContent = text;
                tr.append(td);
            }
            return tr;
        }

        function buildTable(headers, rows) {
            const table = document.createElement("table");
            if (headers) {
                const thead = document.createElement("thead");
                const tr = document.createElement("tr");
                for (const h of headers) {
                    const th = document.createElement("th");
                    th.textContent = h;
                    tr.append(th);
                }
                thead.append(tr);
                table.append(thead);
            }
            const tbody = document.createElement("tbody");
            tbody.append(...rows);
            table.append(tbody);
            return table;
        }

        function renderStats(s) {
            overviewBody.replaceChildren(
                textRow(["Clients online", `${s.clients_online} / ${s.clients_total}`]),
                textRow(["Primes found (all algorithms)", s.primes_found.toLocaleString()])
            );

            const sections = Object.entries(s.algorithms).map(([alg, a]) => {
                const section = document.createElement("section");

                const title = document.createElement("h2");
                title.textContent = `Algorithm: ${alg}`;

                const stats = buildTable(null, [
                    textRow(["Blocks completed", a.blocks_completed.toLocaleString()]),
                    textRow(["Patterns tested", a.patterns_tested.toLocaleString()]),
                    textRow(["Primes found", a.primes_found.toLocaleString()]),
                    textRow(["Largest prime", a.largest_digits ? `${a.largest_digits.toLocaleString()} digits` : "-"]),
                    textRow(["Open blocks", `${a.open_blocks} (${a.stale_blocks} stale or released)`]),
                    textRow(["Frontier", a.frontier.dims ? a.frontier.dims.join("×") : `pattern ${a.frontier.index}`]),
                ]);

                const topTitle = document.createElement("h3");
                topTitle.textContent = "Biggest primes";

                const top = buildTable(
                    ["#", "Digits", "Shape", "Border", "Inner", "Found by", "Found"],
                    primeRows(a.top)
                );

                section.append(title, stats, topTitle, top);
                return section;
            });

            algsContainer.replaceChildren(...sections);
        }

        async function fetchStats() {
            try {
                const res = await fetch("/api/stats");
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                renderStats(await res.json());
            } catch (e) {
                console.error("Stats failed:", e);
            }
        }

        async function renderClients(clients) {
            if (Object.keys(clients).length === 0) {
                showMessage("No clients connected.");
                return;
            }

            const algs = await getAlgorithms();

            const rows = Object.entries(clients)
                .sort(([, a], [, b]) => (b.last_seen ?? 0) - (a.last_seen ?? 0))
                .map(([id, c]) => {
                    const tr = document.createElement("tr");

                    const cell = (text) => {
                        const td = document.createElement("td");
                        td.textContent = text ?? "";
                        tr.append(td);
                        return td;
                    };

                    cell(id);
                    cell(c.ip);
                    cell(c.port);
                    cell(timeAgo(c.last_seen * 1000));
                    cell((Date.now() - 1000 * c.last_seen) < 5 * 60 * 1000 ? "Online" : "Offline");
                    cell(c.algorithm || "None");
                    cell(c.stats?.blocks_done ?? 0);
                    cell(c.stats?.primes_found ?? 0);
                    cell(c.stats?.blocks_done
                        ? (c.stats.total_block_seconds / c.stats.blocks_done).toFixed(1) + "s"
                        : "-");
                    cell(c.stats?.current_block ?? "-");

                    const td = document.createElement("td");

                    const select = document.createElement("select");
                    for (const name of algs) {
                        const opt = document.createElement("option");
                        opt.value = name;
                        opt.textContent = name;
                        opt.selected = name === c.algorithm;
                        select.append(opt);
                    }

                    const setBtn = document.createElement("button");
                    setBtn.textContent = "Set algorithm";
                    setBtn.addEventListener("click", () => {
                        post(`/api/config/${encodeURIComponent(id)}/algorithm/${encodeURIComponent(select.value)}`);
                    });

                    const delBtn = document.createElement("button");
                    delBtn.textContent = "Delete client (Double click)";
                    delBtn.addEventListener("dblclick", () => {
                        var c = confirm("Are you sure you want to delete this client? It is a one time delete. Permenant.");
                        if (!c) return;
                        post(`/api/delete/${encodeURIComponent(id)}`);
                    });

                    td.append(select, " ", setBtn, " ", delBtn);
                    tr.append(td);

                    return tr;
                });

            clientsBody.replaceChildren(...rows);
        }

        async function fetchClientInfo() {
            try {
                const response = await fetch("/api/clients");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                renderClients(await response.json());
            } catch (e) {
                showMessage(`Failed to fetch: ${e.message}`);
            }
        }

        async function poll() {
            await Promise.all([fetchClientInfo(), fetchStats()]);
            setTimeout(poll, 5000);
        }

        poll();
    </script>
</body>
</html>
